format = """$os$username$hostname$localip$shlvl$singularity$kubernetes$directory$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$git_status$hg_branch$pijul_channel$docker_context$package$c$cmake$cobol$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$gleam$golang$guix_shell$haskell$haxe$helm$java$julia$kotlin$lua$nim$nodejs$ocaml$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$zig$buf$nix_shell$conda$meson$spack$memory_usage$aws$gcloud$openstack$azure$nats$direnv$env_var$crystal$custom$sudo$cmd_duration$time$line_break$jobs$battery$status$container$shell$character"""

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold white"

[os.symbols]
Windows = "Win"
Linux = "Linux"
Macos = "macOS"
Unknown = "?"

[env_var.WSL_DISTRO_NAME]
format = "[(WSL:$env_value)]($style) "
style = "bold cyan"
disabled = false

[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M:%S"
style = "bold yellow"

[cmd_duration]
disabled = false
min_time = 0
format = "[took $duration]($style) "
style = "bold cyan"
show_milliseconds = true
